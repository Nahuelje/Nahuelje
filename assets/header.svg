<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="t d">
  <title id="t">Nahuel Jesus</title>
  <desc id="d">Java Web Developer</desc>
  <style>
  .t { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .ola { animation-timing-function: linear; animation-iteration-count: infinite; }
  .a { animation-name: mueve; animation-duration: 12s; }
  .b { animation-name: mueve; animation-duration: 8s; animation-direction: reverse; }
  .c { animation-name: mueve; animation-duration: 16s; }
  @keyframes mueve { from { transform: translateX(0); } to { transform: translateX(-250px); } }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .titulo { animation: entra 1.2s ease-out both; }
  .sub { animation: entra 1.2s ease-out .5s both; }
  @media (prefers-reduced-motion: reduce) { .ola, .titulo, .sub { animation: none; } }
</style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/><stop offset="0.5" stop-color="#0e75b6"/><stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <clipPath id="forma"><path d="M0,0 H1000 V150 Q875,188 750,150 T500,150 T250,150 T0,150 Z"/></clipPath>
  </defs>
  <g clip-path="url(#forma)">
    <rect width="1000" height="190" fill="url(#g)"/>
    <path class="ola a" fill="#ffffff" fill-opacity="0.07" d="M-250,112 q62.5,-34 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V190 H-250 Z"/>
    <path class="ola b" fill="#ffffff" fill-opacity="0.09" d="M-250,128 q62.5,-28 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V190 H-250 Z"/>
    <path class="ola c" fill="#0d1117" fill-opacity="0.18" d="M-250,142 q62.5,-22 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V190 H-250 Z"/>
  </g>
  <text class="t titulo" x="500" y="86" text-anchor="middle" font-size="48" font-weight="700" fill="#ffffff" stroke="#0d1117" stroke-opacity="0.35" stroke-width="3" paint-order="stroke">Nahuel Jesus</text>
  <text class="t sub" x="500" y="122" text-anchor="middle" font-size="18" fill="#e6edf3">Java Web Developer</text>
</svg>
