<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="t d">
  <title id="t">Terminal de Nahuel Jesus</title>
  <desc id="d">Animación de una terminal que ejecuta whoami, cat status.txt, ls ~/stack y git log, mostrando que es desarrollador Full Stack y de Machine Learning freelancer en Argentina.</desc>
  <style>
  text { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace; font-size: 16px; }
  .cubre { transform-box: fill-box; transform-origin: 100% 50%; animation-duration: 22s; animation-iteration-count: infinite; animation-timing-function: linear; }
  .pr { animation-duration: 22s; animation-iteration-count: infinite; animation-timing-function: step-end; fill-opacity: 0; }
  .cursor { animation: parpadeo 1s steps(1) infinite; }
  .cursor-bloque { opacity: 0; animation: aparece 22s infinite; }
  @keyframes parpadeo { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes aparece { 0%, 73.636% { opacity: 0; } 73.646%, 96.9% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cubre { animation: none; transform: scaleX(0); } .pr { animation: none; fill-opacity: 1; } .cursor { animation: none; } .cursor-bloque { animation: none; opacity: 1; } }

  @keyframes c0 {
    0%, 2.727% { transform: scaleX(1); animation-timing-function: steps(6, end); }
    7.273%, 96.9% { transform: scaleX(0); }
    97%, 100% { transform: scaleX(1); }
  }
  #c0 { animation-name: c0; }
  @keyframes p0 {
    0%, 2.717% { fill-opacity: 0; }
    2.727%, 96.9% { fill-opacity: 1; }
