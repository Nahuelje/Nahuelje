<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Decoración">
  <style>
  .t { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .ola { animation-timing-function: linear; animation-iteration-count: infinite; }
  .a { animation-name: mueve; animation-duration: 12s; }
  .b { animation-name: mueve; animation-duration: 8s; animation-direction: reverse; }
  .c { animation-name: mueve; animation-duration: 16s; }
  @keyframes mueve { from { transform: translateX(0); } to { transform: translateX(-250px); } }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .titulo { animation: entra 1.2s ease-out both; }
  .sub { animation: entra 1.2s ease-out .5s both; }
  @media (prefers-reduced-motion: reduce) { .ola, .titulo, .sub { animation: none; } }
</style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/><stop offset="0.5" stop-color="#0e75b6"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <clipPath id="forma"><path d="M0,40 Q125,4 250,40 T500,40 T750,40 T1000,40 V110 H0 Z"/></clipPath>
  </defs>
  <g clip-path="url(#forma)">
    <rect width="1000" height="110" fill="url(#g)"/>
    <path class="ola b" fill="#ffffff" fill-opacity="0.08" d="M-250,58 q62.5,-22 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V110 H-250 Z"/>
    <path class="ola a" fill="#0d1117" fill-opacity="0.2" d="M-250,74 q62.5,-18 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 V110 H-250 Z"/>
  </g>
</svg>
